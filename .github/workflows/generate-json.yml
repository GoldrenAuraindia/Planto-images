name: Generate Plant JSON

on:
  push:
    paths:
      - 'plants/*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Run script
        run: node generate-json.js

      - name: Commit JSON
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add plants.json
          git commit -m "Auto update plants.json" || echo "No changes"
          git push
